# credentials.yaml - Device Connection Credentials
# 
# IMPORTANT: This file contains sensitive credentials and should NEVER be committed to git.
# It is already listed in .gitignore to prevent accidental commits.
#
# For first-time setup, copy credentials.yaml.example to credentials.yaml and update
# with your actual device credentials.

# SSH Connection Settings
ssh:
  host: "10.92.197.120"      # Target device IP address
  port: 22                    # SSH port (default: 22)
  username: "root"            # SSH username
  password: "oelinux123"      # SSH password

# Serial Connection Settings (for ADB/Serial mode)
serial:
  port: "COM7"                # Serial port (Windows: COM7, Linux: /dev/ttyUSB0)
  baudrate: 115200            # Baud rate
  username: "root"            # Login username
  password: "oelinux123"      # Login password

# ADB Connection Settings
adb:
  # ADB uses the serial connection for initial setup, then switches to ADB over USB
  # No additional credentials needed beyond serial settings above
  enabled: true

